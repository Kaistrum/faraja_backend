<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisis Reports Map - RAPIDA</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #e8e1f0 100%);
            color: white;
            padding: 20px;
        }

        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }

        .container {
            display: flex;
            height: calc(100vh - 100px);
        }

        .sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            padding: 20px;
        }

        .map-container { flex: 1; }

        #map { width: 100%; height: 100%; }

        .stats {
            background: #667eea;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .report-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            cursor: pointer;
            border-radius: 4px;
        }

        .report-item:hover {
            background: #f0f0f0;
        }

        .damage-badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 11px;
            color: white;
            border-radius: 3px;
        }

        .damage-minimal { background: #4caf50; }
        .damage-partial { background: #ff9800; }
        .damage-complete { background: #f44336; }

        .status-badge {
            margin-left: 5px;
            font-size: 10px;
            background: #ddd;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .error { color: red; }
    </style>
</head>

<body>

<div class="header">
    <h1>Crisis Reports Map</h1>
    <p>Live visualization of disaster reports</p>
</div>

<div class="container">
    <div class="sidebar">
        <div class="stats">
            <div class="stat-row"><span>Total:</span><span id="stat-total">0</span></div>
            <div class="stat-row"><span>Critical:</span><span id="stat-critical">0</span></div>
            <div class="stat-row"><span>Pending:</span><span id="stat-pending">0</span></div>
            <div class="stat-row"><span>Resolved:</span><span id="stat-resolved">0</span></div>
        </div>

        <h3>Reports</h3>
        <div id="reports-list">Loading...</div>
    </div>

    <div class="map-container">
        <div id="map"></div>
    </div>
</div>

<script>
    // INIT MAP
    const map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let markers = {};
    let allReports = [];

    // SAFE COORDINATE PARSER
    function getLatLng(report) {
        const coords = report.location?.coordinates;
        if (!coords || coords.length !== 2) return null;

        const [lng, lat] = coords; // GeoJSON format
        return [lat, lng]; // Leaflet format
    }

    async function loadReports() {
        try {
            const res = await fetch('/api/reports/');
            const data = await res.json();

            const reports = data.results || data;
            allReports = reports;

            // clear markers
            Object.values(markers).forEach(m => m.remove());
            markers = {};

            const list = document.getElementById('reports-list');
            list.innerHTML = '';

            let stats = { total: 0, critical: 0, pending: 0, resolved: 0 };

            reports.forEach(report => {
                stats.total++;

                if (report.damage_level === 'complete') stats.critical++;
                if (report.status === 'pending') stats.pending++;
                if (report.status === 'resolved') stats.resolved++;

                // MAP MARKER
                const latLng = getLatLng(report);

                if (latLng) {
                    const colorMap = {
                        minimal: '#4caf50',
                        partial: '#ff9800',
                        complete: '#f44336'
                    };

                    const marker = L.circleMarker(latLng, {
                        radius: 8,
                        fillColor: colorMap[report.damage_level] || '#667eea',
                        color: '#fff',
                        weight: 2,
                        fillOpacity: 0.8
                    }).addTo(map);

                    marker.bindPopup(`
                        <b>${report.event_name}</b><br>
                        Status: ${report.status}<br>
                        Damage: ${report.damage_level}<br>
                        Type: ${report.infrastructure_type}
                    `);

                    markers[report.report_id] = marker;
                }

                // SIDEBAR ITEM
                const el = document.createElement('div');
                el.className = 'report-item';

                el.innerHTML = `
                    <h4>${report.event_name}</h4>
                    <p><b>ID:</b> ${report.event_id}</p>
                    <p><b>Location:</b> ${report.location_description || 'N/A'}</p>
                    <div>
                        <span class="damage-badge damage-${report.damage_level}">
                            ${report.damage_level.toUpperCase()}
                        </span>
                        <span class="status-badge">${report.status}</span>
                    </div>
                `;

                el.onclick = () => {
                    const latLng = getLatLng(report);
                    if (latLng) {
                        map.setView(latLng, 15);
                        if (markers[report.report_id]) {
                            markers[report.report_id].openPopup();
                        }
                    }
                };

                list.appendChild(el);
            });

            // stats update
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-critical').textContent = stats.critical;
            document.getElementById('stat-pending').textContent = stats.pending;
            document.getElementById('stat-resolved').textContent = stats.resolved;

            if (reports.length === 0) {
                list.innerHTML = "<p>No reports found</p>";
            }

        } catch (err) {
            document.getElementById('reports-list').innerHTML =
                `<div class="error">Error: ${err.message}</div>`;
        }
    }

    loadReports();
    setInterval(loadReports, 30000);
</script>

</body>
</html>
